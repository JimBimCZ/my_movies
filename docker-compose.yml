services:
  db:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: movies
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      retries: 10

  app:
    build: .
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgresql://postgres:devpass@db:5432/movies
      DB_DRIVER: node-postgres
      # ${VAR:?err} fails fast instead of silently sending an empty token: without it,
      # `up` serves 200s with an empty catalogue — nothing looks broken. Export it first,
      # e.g. `set -a; . ./.env.local; set +a`. This also blocks ps/stop/down/logs (`logs`
      # included — the command you'd reach for first); every guarded variable needs a
      # placeholder to unblock teardown: `TMDB_ACCESS_TOKEN=x AUTH_SECRET=x AUTH_GITHUB_ID=x
      # AUTH_GITHUB_SECRET=x AUTH_GOOGLE_ID=x AUTH_GOOGLE_SECRET=x docker compose down -v`.
      TMDB_ACCESS_TOKEN: ${TMDB_ACCESS_TOKEN:?set TMDB_ACCESS_TOKEN before running compose, e.g. set -a; . ./.env.local; set +a}
      AUTH_URL: http://localhost:3000
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET before running compose, e.g. set -a; . ./.env.local; set +a}
      AUTH_GITHUB_ID: ${AUTH_GITHUB_ID:?set AUTH_GITHUB_ID before running compose, e.g. set -a; . ./.env.local; set +a}
      AUTH_GITHUB_SECRET: ${AUTH_GITHUB_SECRET:?set AUTH_GITHUB_SECRET before running compose, e.g. set -a; . ./.env.local; set +a}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:?set AUTH_GOOGLE_ID before running compose, e.g. set -a; . ./.env.local; set +a}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:?set AUTH_GOOGLE_SECRET before running compose, e.g. set -a; . ./.env.local; set +a}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
